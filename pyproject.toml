[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "speechprefix"
version = "0.1.0"
description = "Retrospective supervised prediction of speech ideas from preceding-week news context"
requires-python = ">=3.10"
dependencies = []

[project.optional-dependencies]
test = ["pytest>=8,<9"]
ml = ["torch>=2.15,<2.16; python_version >= '3.11'", "transformers>=5.22,<6; python_version >= '3.11'"]
ncm = ["torch>=2.15,<2.16; python_version >= '3.11'", "transformers>=5.22,<6; python_version >= '3.11'", "hydra-core>=1.3,<2", "omegaconf>=2.3,<3"]

[project.scripts]
speechprefix = "speechprefix.cli:main"

[tool.setuptools.packages.find]
include = ["speechprefix*"]

[tool.setuptools.package-data]
speechprefix = ["configs/*.yaml", "_vendor/ncm/LICENSE", "_vendor/ncm/UPSTREAM.md", "_vendor/ncm/models/*.py", "_vendor/ncm/utils/*.py", "_vendor/ncm/tokenization/*.py"]
